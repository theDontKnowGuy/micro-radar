; Panel selection is a build flag -- see include/DisplayConfig.h.
;   esp32-s3-devkitm-1  1.28" 240x240 GC9A01  (default)
;   esp32-s3-gc9b72     2.1"  360x360 GC9B72
;
; Build/flash with PlatformIO's own python, not the project .venv:
;   ~/.platformio/penv/bin/pio run -e esp32-s3-gc9b72 -t upload -t monitor

[base]
platform = espressif32@7.0.1
framework = arduino
monitor_speed = 115200
upload_protocol = esptool
build_unflags =
    -std=gnu++11
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -std=gnu++17
    -Wall
    ; The firmware download runs on the Arduino loop task so the panel can be
    ; parked first. A TLS handshake does not fit in the default 8KB stack.
    -DARDUINO_LOOP_STACK_SIZE=16384
; Two app slots so the radar can flash a downloaded image into the one it is not
; running from -- see the header of partitions_ota.csv. huge_app.csv declares
; only ota_0 and makes self-updating impossible.
board_build.partitions = partitions_ota.csv
lib_deps =
    lovyan03/LovyanGFX@1.2.21
    mathieucarbou/ESP Async WebServer@3.0.6
    mathieucarbou/AsyncTCP@3.3.2
    bblanchon/ArduinoJson@7.4.3


[env:esp32-s3-devkitm-1]
extends = base
board = esp32-s3-devkitm-1
build_flags =
    ${base.build_flags}
    -DPANEL_GC9A01
    ; Manifest key for this board. The updater will only install an image
    ; published under a matching key, so a 360x360 build is never offered here.
    -DFIRMWARE_BUILD=\"esp32-s3-devkitm-1\"


; Requires an N16R8 module: 16MB flash + 8MB octal PSRAM.
;
; The 360x360 backbuffer is 129,600 bytes, which does not fit in SRAM alongside
; the WiFi stack and a TLS handshake -- OpenSky requests fail with
; "SSL - Memory allocation failed". The backbuffer therefore lives in PSRAM.
;
; The stock esp32-s3-devkitm-1 board definition declares 8MB flash and no PSRAM,
; so both are overridden here. Do not flash this env to an S3 without octal
; PSRAM; use esp32-s3-devkitm-1 (GC9A01) instead.
[env:esp32-s3-gc9b72]
extends = base
board = esp32-s3-devkitm-1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
; maximum_size is deliberately not set: with a custom partition table
; PlatformIO derives the limit from the app slot in partitions_ota.csv, which is
; what actually has to hold the image. Overriding it with the raw flash size
; disables the "firmware too big" check and lets an oversized build through to
; a device that then fails to boot.
build_flags =
    ${base.build_flags}
    -DPANEL_GC9B72
    -DBOARD_HAS_PSRAM
    ; Manifest key for this board -- see the GC9A01 env above.
    -DFIRMWARE_BUILD=\"esp32-s3-gc9b72\"
