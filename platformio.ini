; Panel selection is a build flag -- see include/DisplayConfig.h.
;   esp32-s3-devkitm-1  1.28" 240x240 GC9A01  (default)
;   esp32-s3-gc9b72     2.1"  360x360 GC9B72
;
; Build/flash with PlatformIO's own python, not the project .venv:
;   ~/.platformio/penv/bin/pio run -e esp32-s3-gc9b72 -t upload -t monitor

[base]
platform = espressif32@7.0.1
framework = arduino
monitor_speed = 115200
upload_protocol = esptool
build_unflags =
    -std=gnu++11
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -std=gnu++17
    -Wall
board_build.partitions = huge_app.csv
lib_deps =
    lovyan03/LovyanGFX@1.2.21
    tzapu/WiFiManager@2.0.17
    mathieucarbou/ESP Async WebServer@3.0.6
    mathieucarbou/AsyncTCP@3.3.2
    bblanchon/ArduinoJson@7.4.3


[env:esp32-s3-devkitm-1]
extends = base
board = esp32-s3-devkitm-1
build_flags =
    ${base.build_flags}
    -DPANEL_GC9A01


[env:esp32-s3-gc9b72]
extends = base
board = esp32-s3-devkitm-1
build_flags =
    ${base.build_flags}
    -DPANEL_GC9B72


[env:esp32-c3-devkitm-1]
extends = base
board = esp32-c3-devkitm-1
monitor_port = /dev/cu.usbmodem1101
upload_port = /dev/cu.usbmodem1101
build_flags =
    ${base.build_flags}
    -DPANEL_GC9A01
